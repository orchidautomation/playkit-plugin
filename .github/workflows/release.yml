name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release version override, e.g. 0.1.1"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    name: Publish GitHub release assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check out Pluxx
        uses: actions/checkout@v4
        with:
          repository: orchidautomation/pluxx
          ref: d0205280f7c5197a2efe454b5e14ccfd2a7544bb
          path: .pluxx-release

      - name: Install Pluxx
        working-directory: .pluxx-release
        run: |
          npm ci
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g "$RUNNER_TEMP"/orchid-labs-pluxx-*.tgz

      - name: Validate plugin
        run: pluxx test

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -n "$version" ]; then
            pluxx publish --github-release --allow-dirty --version "$version"
          else
            pluxx publish --github-release --allow-dirty
          fi

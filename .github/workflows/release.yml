name: Release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release version override, e.g. 0.1.1"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  github-release:
    name: Publish GitHub release assets
    runs-on: ubuntu-latest
    env:
      PLUXX_VERSION: 0.1.36
      PLUXX_INTEGRITY: sha512-23lcYezDYXG0FM5Ys9Nrw7oBvp6pX5StkeWeoDcBm7HZ/V3z3djA9y3p3KVXAGzhkubIEUUaC1kD7evKqBB1DQ==

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install verified Pluxx
        run: |
          actual_integrity="$(npm view "@orchid-labs/pluxx@$PLUXX_VERSION" dist.integrity)"
          test "$actual_integrity" = "$PLUXX_INTEGRITY"
          npm install -g "@orchid-labs/pluxx@$PLUXX_VERSION"
          test "$(pluxx --version)" = "$PLUXX_VERSION"

      - name: Validate plugin
        env:
          PLUXX_COMMAND_JSON: '["pluxx"]'
          OPENCODE_TYPESCRIPT_RUNNER_JSON: '["npx", "--yes", "tsx@4.20.3"]'
        run: |
          pluxx test
          node --test tests/opencode-wrapper.test.mjs

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -n "$version" ]; then
            pluxx publish --github-release --allow-dirty --version "$version"
          else
            pluxx publish --github-release --allow-dirty
          fi
